<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Gestión de clubes</title>

    <style>
        :root {
            --verde: #009444;
            --dorado: #d79b27;
            --gris: #5d7079;
            --fondo: #eef1f2;
            --blanco: #ffffff;
            --texto: #263238;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--texto);
            font-family: Arial, sans-serif;
            background: var(--fondo);
        }

        header {
            padding: 30px 20px;
            color: var(--blanco);
            text-align: center;
            background: var(--verde);
            border-bottom: 8px solid var(--dorado);
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        section {
            margin-bottom: 24px;
            padding: 24px;
            background: var(--blanco);
            border-left: 6px solid var(--gris);
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000015;
        }

        section.consulta {
            text-align: center;
            border-left-color: var(--dorado);
        }

        h2 {
            margin-top: 0;
            color: var(--gris);
        }

        label {
            display: block;
            margin-top: 10px;
            color: var(--gris);
            font-weight: bold;
        }

        input,
        select,
        button {
            width: 100%;
            margin: 7px 0;
            padding: 11px;
            font-size: 16px;
            border: 1px solid #b8c1c5;
            border-radius: 6px;
        }

        input:focus,
        select:focus {
            outline: 2px solid var(--dorado);
            border-color: var(--verde);
        }

        button {
            color: var(--blanco);
            font-weight: bold;
            background: var(--verde);
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: var(--gris);
        }

        .boton-datos {
            color: var(--texto);
            background: var(--dorado);
        }

        .boton-datos:hover {
            color: var(--blanco);
            background: var(--gris);
        }

        footer {
            padding: 22px;
            color: var(--blanco);
            text-align: center;
            background: var(--gris);
        }

        @media (max-width: 600px) {
            main {
                margin: 15px auto;
                padding: 0 12px;
            }

            section {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Gestión de clubes universitarios</h1>
        <p>Universidad del Valle de Guatemala</p>
    </header>

    <main>
        <section class="consulta">
            <h2>Información registrada</h2>

            <p>
                Consulta miembros, identificadores,
                estados y actividades.
            </p>

            <form action="/datos" method="get">
                <button
                    class="boton-datos"
                    type="submit"
                >
                    Mostrar todos los datos
                </button>
            </form>
        </section>

        <section>
            <h2>Agregar miembro</h2>

            <form
                action="/agregar-miembro"
                method="post"
            >
                <label for="nombre">
                    Nombre completo
                </label>

                <input
                    id="nombre"
                    name="nombre"
                    placeholder="Ejemplo: María López"
                    required
                >

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    id="correo"
                    name="correo"
                    type="email"
                    placeholder="nombre@uvg.edu.gt"
                    required
                >

                <label for="carne">
                    Carné
                </label>

                <input
                    id="carne"
                    name="carne"
                    placeholder="Ejemplo: 260011"
                    required
                >

                <label for="estado-miembro">
                    Estado
                </label>

                <select
                    id="estado-miembro"
                    name="estado"
                >
                    <option value="ACTIVO">
                        Activo
                    </option>

                    <option value="INACTIVO">
                        Inactivo
                    </option>

                    <option value="PENDIENTE_CONFIRMACION">
                        Pendiente de confirmación
                    </option>

                    <option value="RETIRADO">
                        Retirado
                    </option>
                </select>

                <button type="submit">
                    Agregar miembro
                </button>
            </form>
        </section>

        <section>
            <h2>Cambiar estado de un miembro</h2>

            <form
                action="/cambiar-estado"
                method="post"
            >
                <label for="miembro-id">
                    ID del estudiante
                </label>

                <input
                    id="miembro-id"
                    name="id"
                    type="number"
                    min="1"
                    placeholder="Ejemplo: 3"
                    required
                >

                <label for="nuevo-estado">
                    Nuevo estado
                </label>

                <select
                    id="nuevo-estado"
                    name="estado"
                >
                    <option value="ACTIVO">
                        Activo
                    </option>

                    <option value="INACTIVO">
                        Inactivo
                    </option>

                    <option value="PENDIENTE_CONFIRMACION">
                        Pendiente de confirmación
                    </option>

                    <option value="RETIRADO">
                        Retirado
                    </option>
                </select>

                <button type="submit">
                    Cambiar estado
                </button>
            </form>
        </section>

        <section>
            <h2>Agregar actividad</h2>

            <form
                action="/agregar-actividad"
                method="post"
            >
                <label for="actividad-nombre">
                    Nombre de la actividad
                </label>

                <input
                    id="actividad-nombre"
                    name="nombre"
                    placeholder="Ejemplo: Ensayo general"
                    required
                >

                <label for="fecha-hora">
                    Fecha y hora
                </label>

                <input
                    id="fecha-hora"
                    name="fechaHora"
                    type="datetime-local"
                    required
                >

                <label for="lugar">
                    Lugar
                </label>

                <input
                    id="lugar"
                    name="lugar"
                    placeholder="Ejemplo: Salón de música"
                    required
                >

                <label for="tipo">
                    Tipo de actividad
                </label>

                <input
                    id="tipo"
                    name="tipo"
                    placeholder="Ejemplo: Ensayo"
                    required
                >

                <button type="submit">
                    Agregar actividad
                </button>
            </form>
        </section>
    </main>

    <footer>
        Programación Orientada a Objetos Kathy y Abril 
    </footer>
</body>
</html>
